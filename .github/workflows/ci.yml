name: ZARA CI

on:
  push:
    branches: [main, cloudflare-workers-migration]
  pull_request:
    branches: [main, cloudflare-workers-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application and Worker tests
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Production frontend build
        run: npm run build

      - name: Validate Cloudflare Worker bundle and configuration
        run: npm run worker:dry-run
